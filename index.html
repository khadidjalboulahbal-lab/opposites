<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opposites</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f9f9f9;--card:#ffffff;--ink:#0b2e5e;--mute:#4b5d78;--a:#ed1c24;--b:#0a7cff;--line:#e6e6e6;--ok:#00a651;--bad:#ed1c24;--sun:#ffbe0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a2b3f;--card:#0b2e5e;--ink:#f9f9f9;--mute:#cdebff;--a:#ffbe0b;--b:#00aeff;--line:#2b4d7d;--ok:#2ecf7a;--bad:#ff6b70}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
h1 span:first-child{color:var(--a)}h1 span:last-child{color:var(--b)}
.sub{color:var(--mute);margin:0 0 16px}
nav{display:flex;gap:6px;margin-bottom:18px}
nav button{flex:1;padding:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 1rem inherit;font-family:inherit;border-radius:12px;cursor:pointer}
nav button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg);box-shadow:0 4px 0 var(--sun)}
button:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;text-align:center}
.pair .e{display:block;height:60px;line-height:60px;transition:transform .15s;font-size:2.2rem}
.w{font:800 1.4rem inherit;font-family:inherit;border:0;background:none;cursor:pointer;padding:4px 8px;border-radius:8px;transition:opacity .15s}
.w.a{color:var(--a)}.w.b{color:var(--b)}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--ink)}
.hint{font-size:.9rem;color:var(--mute);margin:0 0 12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 1.1rem inherit;font-family:inherit;border-radius:12px;cursor:pointer;margin-bottom:8px;width:100%}
.tile.sel{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun);transform:scale(1.03)}
.tile.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ink);cursor:default}
.tile.no{border-color:var(--bad);animation:sh .25s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.tile.no{animation:none}.pair .e{transition:none}}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mute)}
.ghost{border:2px solid var(--ink);background:none;color:var(--ink);font:600 1rem inherit;font-family:inherit;padding:8px 14px;border-radius:12px;cursor:pointer}
.q{font-size:1.5rem;font-weight:800;margin:6px 0 14px}
.q b{color:var(--a)}
.opt{display:block}
.msg{min-height:1.6em;font-weight:600;margin:6px 0}
.big{font-size:2.4rem;font-weight:800;text-align:center;margin:12px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1><span>Opposites</span> <span>Game</span></h1>
<p class="sub">Learn nine pairs of opposite words.</p>
<nav role="tablist">
<button role="tab" aria-selected="true" data-t="learn">Learn</button>
<button role="tab" aria-selected="false" data-t="match">Match</button>
<button role="tab" aria-selected="false" data-t="quiz">Quiz</button>
</nav>

<section id="learn"><p class="hint">Move the slider. Tap a word to hear it.</p><div id="cards"></div></section>

<section id="match" hidden>
<div class="bar"><span id="mc">Matched: 0 / 9</span><button class="ghost" id="mr">Shuffle</button></div>
<div class="cols"><div id="ml"></div><div id="mrr"></div></div>
<p class="msg" id="mm"></p>
</section>

<section id="quiz" hidden>
<div class="bar"><span id="qn"></span><span id="qs"></span></div>
<div id="qbox"></div>
</section>
</main>

<script>
const P=[["hot","cold","🔥","🧊"],["short","tall","🌱","🌳"],["fat","thin","🐻","🐍"],["big","small","🐘","🐜"],["fast","slow","🐆","🐢"],["easy","difficult","😊","😵"],["long","short","📏","✏️"],["old","new","📜","🆕"],["light","heavy","🪶","🪨"]];
const opp={};P.forEach(([x,y])=>{(opp[x]=opp[x]||new Set()).add(y);(opp[y]=opp[y]||new Set()).add(x)});
const all=[...new Set(P.flat().filter(v=>!/[^a-z]/.test(v)))];
const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}

/* tabs */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
 ["learn","match","quiz"].forEach(id=>$("#"+id).hidden=id!==b.dataset.t);
});

/* learn */
P.forEach(([x,y,ex,ey])=>{
 const d=document.createElement("div");d.className="card";
 d.innerHTML=`<div class="pair"><div><span class="e" data-l>${ex}</span><button class="w a">${x}</button></div><div><span class="e" data-r>${ey}</span><button class="w b">${y}</button></div></div><input type="range" min="0" max="100" value="50" aria-label="${x} or ${y}">`;
 const [bx,by]=d.querySelectorAll(".w"),l=d.querySelector("[data-l]"),r=d.querySelector("[data-r]"),s=d.querySelector("input");
 const up=()=>{const v=+s.value;l.style.transform=`scale(${.7+(100-v)/100*.9})`;r.style.transform=`scale(${.7+v/100*.9})`;bx.style.opacity=.35+(100-v)/100*.65;by.style.opacity=.35+v/100*.65};
 s.oninput=up;up();bx.onclick=()=>{say(x);s.value=0;up()};by.onclick=()=>{say(y);s.value=100;up()};
 $("#cards").append(d);
});

/* match */
let sel=null,got=0;
function mk(w,side){const b=document.createElement("button");b.className="tile";b.textContent=w;b.dataset.w=w;b.dataset.s=side;b.onclick=()=>pick(b);return b}
function pick(b){
 if(b.classList.contains("done"))return;say(b.dataset.w);
 if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
 const L=sel.dataset.s==="l"?sel:b,R=sel.dataset.s==="l"?b:sel;
 sel.classList.remove("sel");
 if(P.some(p=>p[0]===L.dataset.w&&p[1]===R.dataset.w)){
  L.classList.add("done");R.classList.add("done");got++;
  $("#mc").textContent=`Matched: ${got} / 9`;
  $("#mm").textContent=got===9?"Great job! All nine pairs are matched.":`Yes! ${L.dataset.w} ↔ ${R.dataset.w}`;
 }else{
  [L,R].forEach(t=>{t.classList.add("no");setTimeout(()=>t.classList.remove("no"),300)});
  $("#mm").textContent="Not this pair. Try again.";
 }
 sel=null;
}
function newMatch(){
 got=0;sel=null;$("#mc").textContent="Matched: 0 / 9";$("#mm").textContent="Tap a word on the left, then its opposite on the right.";
 $("#ml").replaceChildren(...shuffle(P.map(p=>p[0])).map(w=>mk(w,"l")));
 $("#mrr").replaceChildren(...shuffle(P.map(p=>p[1])).map(w=>mk(w,"r")));
}
$("#mr").onclick=newMatch;newMatch();

/* quiz */
let Q=[],qi=0,sc=0;
function newQuiz(){
 Q=shuffle(P).map(p=>Math.random()<.5?[p[0],p[1]]:[p[1],p[0]]);qi=0;sc=0;showQ();
}
function showQ(){
 const box=$("#qbox");
 if(qi>=Q.length){
  $("#qn").textContent="Finished";
  box.innerHTML=`<div class="card"><div class="big">${sc} / ${Q.length}</div><p class="msg" style="text-align:center">${sc>=8?"Excellent!":sc>=5?"Good work! Try again for a higher score.":"Keep practising. Go to Learn and try again."}</p><button class="ghost" id="again">Play again</button></div>`;
  $("#again").onclick=newQuiz;return;
 }
 const [w,a]=Q[qi];
 $("#qn").textContent=`Question ${qi+1} of ${Q.length}`;$("#qs").textContent=`Score: ${sc}`;
 const ds=shuffle(all.filter(x=>x!==w&&!opp[w].has(x))).slice(0,2);
 const opts=shuffle([a,...ds]);
 box.innerHTML=`<div class="card"><p class="q">The opposite of <b>${w}</b> is…</p><div id="o"></div><p class="msg" id="fb"></p><button class="ghost" id="nx" hidden>Next</button></div>`;
 const o=$("#o");
 opts.forEach(t=>{const b=document.createElement("button");b.className="tile opt";b.textContent=t;
  b.onclick=()=>{
   const ok=opp[w].has(t);
   o.querySelectorAll("button").forEach(x=>{x.disabled=true;if(opp[w].has(x.textContent))x.classList.add("done")});
   if(ok){sc++;$("#fb").textContent="Correct! "+w+" ↔ "+t}else{b.classList.add("no");$("#fb").textContent="Not quite. The answer is "+a+"."}
   $("#qs").textContent=`Score: ${sc}`;say(w+", "+a);$("#nx").hidden=false;$("#nx").focus();
  };o.append(b)});
 $("#nx").onclick=()=>{qi++;showQ()};
}
newQuiz();
</script>
</body>
</html>
